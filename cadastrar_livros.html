<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body>
    <video autoplay muted loop id="bg-video">
    <source src="src/universo.mp4" type="video/mp4">
    Seu navegador não suporta vídeo em HTML5.
    </video>
    <header>
            <img src="imagens/logo_senac.png" alt="" class="logo">
        
        <nav>
            <a href="index.html">Início</a>
            <a href="cadastro.html">Cadastre-se</a>
            <a href="login.html">Entrar</a>
        </nav>
    </header>
    <main class="main-detalhe">
        <form action="" method="post">
            <p>Cadastrar Livro</p>
            <div class="form-items">
                <label for="titulo">Título: </label>
                <input type="text" name="titulo" id="titulo">
            </div>
            <div class="form-items">
                <label for="Ano">Ano Publicação: </label>
                <input type="text" name="ano" id="ano">
            </div>
            <div class="form-items">
                <label for="autor">Autor: </label>
                <input type="text" name="autor" id="autor">
            </div>
            <div class="form-items">
                <label for="resumo">Resumo: </label>
                <textarea name="resumo" id="resumo" cols="30" rows="10"></textarea>
            </div>
            <div class="form-items">
                <label for="categoria">Categoria: </label>
                <select name="categoria" class="categoria">
                    <option value="aventura">Aventura</option>
                    <option value="romance">Romance</option>
                </select>
            </div>
            <button type="submit">Cadastrar</button>
        </form>
    </main>
    <footer>
        <p>2026</p>
    </footer>
</body>
</html>
